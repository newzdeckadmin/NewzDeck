name: Publish Windows release trigger

on:
  push:
    branches:
      - main
    paths:
      - '.release-trigger/**'

permissions:
  contents: write

concurrency:
  group: newzdeck-production-release
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.12.10'
  GO_VERSION: '1.23.2'
  SABCTOOLS_VERSION: '9.6.3'
  SABCTOOLS_COMMIT: '54d7663b9e8f527b5ab196d43f0d5c561a87c1ac'

jobs:
  release:
    name: Build, validate, and publish Windows release
    if: github.repository == 'newzdeckadmin/NewzDeck'
    runs-on: windows-2022
    timeout-minutes: 55

    steps:
      - name: Check out release source
        uses: actions/checkout@v6
        with:
          fetch-depth: 4

      - name: Enforce canonical LF source checkout
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path variable:PSNativeCommandUseErrorActionPreference) { $PSNativeCommandUseErrorActionPreference = $true }
          git config core.autocrlf false
          git config core.eol lf
          git checkout --force HEAD -- .

      - name: Resolve and validate release trigger
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path variable:PSNativeCommandUseErrorActionPreference)) { throw 'PowerShell native-command failure propagation is unavailable.' }
          $PSNativeCommandUseErrorActionPreference = $true

          $version = (Get-Content -LiteralPath 'src/app/version.txt' -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid source version '$version'." }
          $trigger = ".release-trigger/$version"
          if (-not (Test-Path -LiteralPath $trigger -PathType Leaf)) { throw "Release trigger '$trigger' is missing." }

          $changed = @(& git diff-tree --no-commit-id --name-only -r HEAD)
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect the trigger commit.' }
          if ($changed.Count -ne 1 -or $changed[0] -cne $trigger) {
            throw "The release-trigger commit must change only '$trigger'. Changed: $($changed -join ', ')"
          }

          & git diff HEAD^ HEAD --check
          if ($LASTEXITCODE -ne 0) { throw 'The release-trigger commit contains whitespace errors.' }
          & git show --check --oneline --no-renames HEAD^ | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'The production-source commit contains whitespace errors.' }

          $sourceCommitLine = Get-Content -LiteralPath $trigger | Where-Object { $_ -like 'Source commit:*' } | Select-Object -First 1
          if (-not $sourceCommitLine) { throw 'Release trigger does not identify the validated source commit.' }
          $declaredSourceCommit = ($sourceCommitLine -replace '^Source commit:\s*','').Trim()
          $actualSourceCommit = (& git rev-parse HEAD^).Trim()
          if ($declaredSourceCommit -cne $actualSourceCommit) {
            throw "Trigger source commit '$declaredSourceCommit' does not match parent '$actualSourceCommit'."
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "source_commit=$actualSourceCommit" >> $env:GITHUB_OUTPUT
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Set up canonical Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up canonical Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Validate NewzDeck source and v3.7.4 regression guard
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path variable:PSNativeCommandUseErrorActionPreference)) { throw 'PowerShell native-command failure propagation is unavailable.' }
          $PSNativeCommandUseErrorActionPreference = $true

          if ($env:VERSION -cne '3.7.4') { throw "This source workflow is the v3.7.4 production gate, got $env:VERSION." }
          python release/windows/validate-v374-regressions.py
          python -m py_compile src/app/server.py src/app/sab_engine.py src/app/automation_engine.py src/app/yenc_decoder.py release/windows/build-portable.py release/windows/validate-sabctools-runtime.py release/windows/validate-v374-regressions.py
          node --check src/app/static/app.js

          $env:GOOS='windows'; $env:GOARCH='amd64'; $env:CGO_ENABLED='0'
          go build -trimpath -ldflags='-s -w -H windowsgui -buildid=' -o (Join-Path $env:RUNNER_TEMP 'tray-source-smoke.exe') src/windows/NewzDeckTray.go
          go build -trimpath -ldflags='-H windowsgui' -o (Join-Path $env:RUNNER_TEMP 'picker-source-smoke.exe') src/windows/NewzDeckPicker.go
          go build -trimpath -ldflags='-s -w -H windowsgui -buildid=' -o (Join-Path $env:RUNNER_TEMP 'launcher-source-smoke.exe') src/windows/NewzDeckLauncher.go

      - name: Check out exact SABCTools 9.6.3 source
        uses: actions/checkout@v6
        with:
          repository: sabnzbd/sabctools
          ref: ${{ env.SABCTOOLS_COMMIT }}
          path: _upstream/sabctools
          fetch-depth: 1
          persist-credentials: false

      - name: Build and prove SABCTools 9.6.3 for CPython 3.12.10
        id: sabctools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path variable:PSNativeCommandUseErrorActionPreference)) { throw 'PowerShell native-command failure propagation is unavailable.' }
          $PSNativeCommandUseErrorActionPreference = $true

          python -c "import sys; assert sys.version_info[:3] == (3,12,10), sys.version"
          Push-Location '_upstream/sabctools'
          try {
            $actualCommit = (& git rev-parse HEAD).Trim()
            if ($actualCommit -cne $env:SABCTOOLS_COMMIT) { throw "SABCTools commit mismatch: $actualCommit" }
            $header = Get-Content -LiteralPath 'src/sabctools.h' -Raw
            $match = [regex]::Match($header, '#define\s+SABCTOOLS_VERSION\s+"([^"]+)"')
            if (-not $match.Success -or $match.Groups[1].Value -cne $env:SABCTOOLS_VERSION) {
              throw 'SABCTools source version does not match 9.6.3.'
            }
          }
          finally { Pop-Location }

          python -m pip install --disable-pip-version-check --upgrade "setuptools>=77,<82" "wheel>=0.45,<0.46"
          $wheelDir = Join-Path $env:RUNNER_TEMP 'sabctools-wheel'
          New-Item -ItemType Directory -Path $wheelDir -Force | Out-Null
          python -m pip wheel '_upstream/sabctools' --no-deps --no-build-isolation --wheel-dir $wheelDir

          $wheels = @(Get-ChildItem -LiteralPath $wheelDir -Filter 'sabctools-9.6.3-cp312-cp312-win_amd64.whl' -File)
          if ($wheels.Count -ne 1) { throw "Expected one CP312 SABCTools wheel, found $($wheels.Count)." }
          $wheel = $wheels[0].FullName
          $target = Join-Path $env:RUNNER_TEMP 'sabctools-target'
          New-Item -ItemType Directory -Path $target -Force | Out-Null
          python -m pip install --no-deps --no-index --target $target $wheel
          python release/windows/validate-sabctools-runtime.py --target $target

          $package = Join-Path $target 'sabctools'
          $pyd = Join-Path $package 'sabctools.cp312-win_amd64.pyd'
          if (-not (Test-Path -LiteralPath $pyd -PathType Leaf)) { throw 'Built SABCTools native extension is missing.' }
          $wheelSha = (Get-FileHash -LiteralPath $wheel -Algorithm SHA256).Hash.ToLowerInvariant()
          $pydSha = (Get-FileHash -LiteralPath $pyd -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "SABCTools wheel SHA-256: $wheelSha"
          Write-Host "SABCTools native extension SHA-256: $pydSha"
          "package=$package" >> $env:GITHUB_OUTPUT
          "wheel=$wheel" >> $env:GITHUB_OUTPUT
          "wheel_sha256=$wheelSha" >> $env:GITHUB_OUTPUT
          "pyd_sha256=$pydSha" >> $env:GITHUB_OUTPUT

      - name: Build deterministic Portable ZIP
        id: portable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $portableOutput = Join-Path $env:RUNNER_TEMP 'newzdeck-portable-build'
          New-Item -ItemType Directory -Path $portableOutput -Force | Out-Null
          $portable = Join-Path $portableOutput ("NewzDeck_v{0}_Portable.zip" -f $env:VERSION)
          python release/windows/build-portable.py --version $env:VERSION --output $portable --sabctools-package '${{ steps.sabctools.outputs.package }}'
          if (-not (Test-Path -LiteralPath $portable -PathType Leaf)) { throw 'Portable build failed.' }
          "path=$portable" >> $env:GITHUB_OUTPUT
          "sha256=$((Get-FileHash -LiteralPath $portable -Algorithm SHA256).Hash.ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Extract and validate Portable payload
        id: payload
        shell: pwsh
        env:
          PORTABLE_PATH: ${{ steps.portable.outputs.path }}
        run: |
          $ErrorActionPreference = 'Stop'
          $payload = Join-Path $env:RUNNER_TEMP 'newzdeck-release-payload'
          New-Item -ItemType Directory -Path $payload -Force | Out-Null
          Expand-Archive -LiteralPath $env:PORTABLE_PATH -DestinationPath $payload -Force

          $required = @(
            'version.txt','NewzDeck.exe','NewzDeckService.exe','NewzDeckTray.exe','NewzDeckPicker.exe','NewzDeckThumb.exe',
            'NewzDeck.ico','server.py','sab_engine.py','automation_engine.py','yenc_decoder.py',
            'sabctools\__init__.py','sabctools\sabctools.cp312-win_amd64.pyd',
            'static\index.html','static\app.js','static\styles.css','static\themes.css','static\tmdb-logo.svg','SOURCE_MANIFEST.json'
          )
          foreach ($rel in $required) {
            if (-not (Test-Path -LiteralPath (Join-Path $payload $rel) -PathType Leaf)) { throw "Portable is missing '$rel'." }
          }
          foreach ($forbidden in @('NewzDeckBootstrap.exe','NewzDeckCore.exe','NewzDeckYenc.exe','PORTABLE_TESTING.txt','start.sh')) {
            if (Test-Path -LiteralPath (Join-Path $payload $forbidden)) { throw "Portable contains forbidden '$forbidden'." }
          }
          if ((Get-Content -LiteralPath (Join-Path $payload 'version.txt') -Raw).Trim() -cne $env:VERSION) { throw 'Portable version.txt is wrong.' }
          $generatedServer = Get-Content -LiteralPath (Join-Path $payload 'server.py') -Raw
          if (-not $generatedServer.Contains(('APP_VERSION = "{0}"' -f $env:VERSION))) { throw 'Portable server.py APP_VERSION is wrong.' }
          $generatedAdapter = Get-Content -LiteralPath (Join-Path $payload 'sab_engine.py') -Raw
          if (-not $generatedAdapter.Contains(('ADAPTER_VERSION = "{0}"' -f $env:VERSION))) { throw 'Portable sab_engine.py ADAPTER_VERSION is wrong.' }
          $generatedUi = Get-Content -LiteralPath (Join-Path $payload 'static\app.js') -Raw
          if (-not $generatedUi.Contains(("const UI_VERSION = '{0}';" -f $env:VERSION))) { throw 'Portable app.js UI_VERSION is wrong.' }
          $buildManifest = Get-Content -LiteralPath (Join-Path $payload 'build-manifest.json') -Raw | ConvertFrom-Json
          if ([string]$buildManifest.version -cne $env:VERSION -or [string]$buildManifest.adapter_version -cne $env:VERSION) { throw 'Portable build-manifest identities are wrong.' }
          $manifest = Get-Content -LiteralPath (Join-Path $payload 'SOURCE_MANIFEST.json') -Raw | ConvertFrom-Json
          if (@($manifest.newzdeck_owned_binaries).Count -ne 5) { throw 'Expected exactly five NewzDeck-owned Windows binaries.' }
          $sab = @($manifest.vendored_python_packages | Where-Object { $_.name -ceq 'sabctools' })
          if ($sab.Count -ne 1 -or [string]$sab[0].version -cne '9.6.3' -or [string]$sab[0].upstream_commit -cne $env:SABCTOOLS_COMMIT) {
            throw 'Portable SABCTools provenance is wrong.'
          }
          "path=$payload" >> $env:GITHUB_OUTPUT

      - name: Install verified Inno Setup 7.1.0 x64
        id: inno
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe'
          $expected = '0362a383ed217d4c4239b5933866dd96d3eb2102737da92f80f6057a4b40df2f'
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup-7.1.0-x64.exe'
          $dir = Join-Path $env:RUNNER_TEMP 'inno-setup-7.1.0'
          Invoke-WebRequest -UseBasicParsing -Uri $url -OutFile $installer
          $actual = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -cne $expected) { throw "Inno Setup hash mismatch. Expected $expected, got $actual." }
          $signature = Get-AuthenticodeSignature -LiteralPath $installer
          if ($signature.Status -ne 'Valid') { throw "Inno Setup signature verification failed: $($signature.Status)." }
          $p = Start-Process -FilePath $installer -ArgumentList @('/PORTABLE=1','/CURRENTUSER','/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/NOICONS',"/DIR=$dir") -Wait -PassThru -WindowStyle Hidden
          if ($p.ExitCode -ne 0) { throw "Inno Setup installation failed with exit code $($p.ExitCode)." }
          $compiler = Join-Path $dir 'ISCC.exe'
          if (-not (Test-Path -LiteralPath $compiler -PathType Leaf)) { throw 'ISCC.exe was not found.' }
          "path=$compiler" >> $env:GITHUB_OUTPUT

      - name: Build Setup and checksums
        shell: pwsh
        env:
          PORTABLE_PATH: ${{ steps.portable.outputs.path }}
        run: |
          $ErrorActionPreference = 'Stop'
          $output = Join-Path $env:RUNNER_TEMP 'newzdeck-release'
          ./release/windows/build-release.ps1 `
            -PayloadDirectory '${{ steps.payload.outputs.path }}' `
            -PortableArchive $env:PORTABLE_PATH `
            -OutputDirectory $output `
            -Version $env:VERSION `
            -IsccPath '${{ steps.inno.outputs.path }}'

      - name: Verify final release artifacts
        id: verify
        shell: pwsh
        env:
          PORTABLE_SHA256: ${{ steps.portable.outputs.sha256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          $output = Join-Path $env:RUNNER_TEMP 'newzdeck-release'
          $setup = Join-Path $output ("NewzDeck_v{0}_Setup.exe" -f $env:VERSION)
          $portable = Join-Path $output ("NewzDeck_v{0}_Portable.zip" -f $env:VERSION)
          $checksum = Join-Path $output ("NewzDeck_v{0}_SHA256.txt" -f $env:VERSION)
          foreach ($path in @($setup,$portable,$checksum)) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Missing $(Split-Path -Leaf $path)." }
          }
          foreach ($line in Get-Content -LiteralPath $checksum) {
            if ($line -notmatch '^([a-f0-9]{64})  (.+)$') { throw "Invalid checksum line: $line" }
            $actual = (Get-FileHash -LiteralPath (Join-Path $output $Matches[2]) -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -cne $Matches[1]) { throw "Checksum mismatch for $($Matches[2])." }
          }
          $portableHash = (Get-FileHash -LiteralPath $portable -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($portableHash -cne $env:PORTABLE_SHA256) { throw 'Portable changed after source validation.' }
          "setup_sha256=$((Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash.ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "portable_sha256=$portableHash" >> $env:GITHUB_OUTPUT
          "checksum_sha256=$((Get-FileHash -LiteralPath $checksum -Algorithm SHA256).Hash.ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Smoke-test clean install and retired-helper cleanup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Join-Path (Join-Path $env:RUNNER_TEMP 'newzdeck-release') ("NewzDeck_v{0}_Setup.exe" -f $env:VERSION)
          $installDir = Join-Path $env:RUNNER_TEMP 'NewzDeck-v374-smoke'

          function Run-Setup([bool]$UpdateMode) {
            $args = @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/NOICONS','/CLOSEAPPLICATIONS',"/DIR=$installDir")
            if ($UpdateMode) { $args += '/update'; $args += '/FORCECLOSEAPPLICATIONS' }
            $p = Start-Process -FilePath $setup -ArgumentList $args -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "Setup smoke test failed with exit code $($p.ExitCode)." }
          }

          Run-Setup $false
          if ((Get-Content -LiteralPath (Join-Path $installDir 'version.txt') -Raw).Trim() -cne $env:VERSION) { throw 'Installed version is wrong.' }
          if (-not (Test-Path -LiteralPath (Join-Path $installDir 'sabctools\sabctools.cp312-win_amd64.pyd') -PathType Leaf)) { throw 'Installed SABCTools native extension is missing.' }
          if (Test-Path -LiteralPath (Join-Path $installDir 'NewzDeckYenc.exe')) { throw 'Clean install unexpectedly contains NewzDeckYenc.exe.' }

          Set-Content -LiteralPath (Join-Path $installDir 'NewzDeckYenc.exe') -Value 'legacy-helper-placeholder' -Encoding ascii
          Run-Setup $true
          if (Test-Path -LiteralPath (Join-Path $installDir 'NewzDeckYenc.exe')) { throw 'Installed upgrade did not delete the retired NewzDeckYenc.exe.' }
          Write-Host 'Clean-install and retired-helper upgrade cleanup smoke tests passed.'

      - name: Create or verify immutable annotated source tag
        shell: pwsh
        env:
          SOURCE_COMMIT: ${{ steps.version.outputs.source_commit }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path variable:PSNativeCommandUseErrorActionPreference)) { throw 'PowerShell native-command failure propagation is unavailable.' }
          $PSNativeCommandUseErrorActionPreference = $true
          $tag = "v$env:VERSION"
          git fetch --tags --force
          & git rev-parse -q --verify "refs/tags/$tag^{}" *> $null
          if ($LASTEXITCODE -eq 0) {
            $existing = (& git rev-parse "refs/tags/$tag^{}").Trim()
            if ($existing -cne $env:SOURCE_COMMIT) { throw "Existing $tag points to $existing, expected $env:SOURCE_COMMIT." }
            Write-Host "$tag already points to the validated source commit."
          }
          else {
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a $tag $env:SOURCE_COMMIT -m "NewzDeck v$env:VERSION - Release Hygiene & Publisher Reliability Maintenance"
            git push origin "refs/tags/$tag"
          }

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path variable:PSNativeCommandUseErrorActionPreference) { $PSNativeCommandUseErrorActionPreference = $false }
          $tag = "v$env:VERSION"
          & gh release view $tag --json tagName *> $null
          $viewCode = $LASTEXITCODE
          if ($viewCode -eq 0) { throw "Release $tag already exists; refusing to replace public assets." }
          if ($viewCode -ne 1) { throw "Could not safely check whether $tag already exists (gh exit code $viewCode)." }
          $output = Join-Path $env:RUNNER_TEMP 'newzdeck-release'
          $setup = Join-Path $output ("NewzDeck_v{0}_Setup.exe" -f $env:VERSION)
          $portable = Join-Path $output ("NewzDeck_v{0}_Portable.zip" -f $env:VERSION)
          $checksum = Join-Path $output ("NewzDeck_v{0}_SHA256.txt" -f $env:VERSION)
          & gh release create $tag $setup $portable $checksum --verify-tag --title "NewzDeck v$env:VERSION" --notes-file "release/RELEASE_NOTES_v$env:VERSION.md" --latest
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed with exit code $LASTEXITCODE." }
          & gh release view $tag --json tagName,url
          if ($LASTEXITCODE -ne 0) { throw 'Published release could not be verified.' }

      - name: Upload CI build artifact
        uses: actions/upload-artifact@v6
        with:
          name: NewzDeck-v${{ steps.version.outputs.version }}-windows-release
          path: ${{ runner.temp }}/newzdeck-release/*
          if-no-files-found: error
          retention-days: 14

      - name: Release summary
        shell: pwsh
        run: |
          @"
          ## NewzDeck v$env:VERSION
          - Source commit: ${{ steps.version.outputs.source_commit }}
          - Trigger commit: $env:GITHUB_SHA
          - SABCTools wheel SHA-256: ${{ steps.sabctools.outputs.wheel_sha256 }}
          - SABCTools native extension SHA-256: ${{ steps.sabctools.outputs.pyd_sha256 }}
          - Setup SHA-256: ${{ steps.verify.outputs.setup_sha256 }}
          - Portable SHA-256: ${{ steps.verify.outputs.portable_sha256 }}
          - Checksum file SHA-256: ${{ steps.verify.outputs.checksum_sha256 }}
          "@ >> $env:GITHUB_STEP_SUMMARY
